<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aoide</title>
  <link rel="stylesheet" href="result.css">
  <link rel="stylesheet" href="scrollbar.css">
  <style>
    /* 屏幕右下角的小条：图标、学到的词条、撤销；鼠标移上去才出现关闭按钮 */
    .row { flex: 1; min-height: 0; display: flex; align-items: center; gap: 10px; padding: 8px 6px 8px 12px; }
    .ico { flex: none; align-self: flex-start; margin-top: 2px; color: var(--accent); font: 16px/1 "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
    .main { flex: 1; min-width: 0; }
    #title { color: var(--muted); font-size: 11px; line-height: 16px; }
    #items { max-height: 80px; overflow-y: auto; }
    .item { display: flex; align-items: baseline; gap: 6px; font-size: 13px; line-height: 20px; white-space: nowrap; }
    .item .from { flex: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis; color: var(--muted); text-decoration: line-through; }
    .item .arrow { flex: none; color: var(--muted); font: 9px "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
    .item .to { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    #undo { flex: none; height: 26px; padding: 0 8px; border-color: transparent; background: transparent; color: var(--accent); font-size: 12px; }
    #undo:hover { background: var(--control-hover); }
    #undo:disabled { color: var(--muted); }
    #close { flex: none; width: 22px; height: 22px; align-self: flex-start; font-size: 9px; color: var(--muted); visibility: hidden; }
    .card:hover #close { visibility: visible; }
    .countdown { height: 2px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="row">
      <span class="ico">&#xE82D;</span>
      <div class="main">
        <div id="title" data-i18n="learned.title">已加入词库</div>
        <div id="items"></div>
      </div>
      <button id="undo" data-i18n="learned.undo">撤销</button>
      <button id="close" class="icon-btn" title="关闭" aria-label="关闭" data-i18n-title="result.close" data-i18n-aria="result.close">&#xE711;</button>
    </div>
    <div class="countdown"><div id="bar"></div></div>
  </div>
  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="countdown.js"></script>
  <script src="learned.js"></script>
</body>
</html>
