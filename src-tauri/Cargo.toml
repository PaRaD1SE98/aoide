[package]
name = "aoide"
version = "0.5.5"
description = "Local push-to-talk voice typing for Windows and macOS"
authors = ["PaRaD1SE98"]
license = "MIT"
repository = "https://github.com/PaRaD1SE98/aoide"
edition = "2021"

[lib]
name = "aoide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
cpal = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls", "stream"] }
arboard = "3"
sherpa-onnx = "1.13"
tiny-skia = "0.12"
pinyin = "0.11.0"
jieba-rs = "0.11.0"
similar = "3.2.0"
strsim = "0.11.1"
tauri-plugin-updater = "2.14.0"

# whisper.cpp 的 GPU 后端：Windows 用 Vulkan，Apple 芯片的 Mac 用 Metal；Intel Mac 只用 CPU
# （Metal 后端主要面向 Apple 芯片，在 Intel Mac 的显卡上不可靠）
[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(all(target_os = "macos", not(target_arch = "aarch64")))'.dependencies]
whisper-rs = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
