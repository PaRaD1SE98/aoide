<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="desktop.css">
  <style>
    .page { flex: 1; padding: 20px 32px; background: #fff; }
    .page h3 { margin: 0 0 12px; font-size: 18px; }
    .line { height: 10px; margin: 10px 0; border-radius: 5px; background: #e8eaef; }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar"><span class="name" id="app"></span><span class="ctl">&#xE921;</span><span class="ctl">&#xE922;</span><span class="ctl">&#xE8BB;</span></div>
    <div class="page">
      <h3 id="heading"></h3>
      <div class="line" style="width: 92%"></div>
      <div class="line" style="width: 85%"></div>
      <div class="line" style="width: 88%"></div>
      <div class="line" style="width: 60%"></div>
      <div class="line" style="width: 90%"></div>
      <div class="line" style="width: 76%"></div>
    </div>
  </div>
  <iframe class="result" id="card"></iframe>
  <div class="taskbar"><span>&#xE8FC;</span><span class="on">&#xE774;</span><span>&#xE8B7;</span><span>&#xE8BD;</span></div>
  <script>
    const lang = ["zh", "en", "ja"].includes(new URLSearchParams(location.search).get("lang")) ? new URLSearchParams(location.search).get("lang") : "en";
    document.documentElement.lang = lang;
    const text = { zh: { app: "浏览器", heading: "项目周报" }, en: { app: "Browser", heading: "Weekly report" },
                   ja: { app: "ブラウザー", heading: "週次レポート" } }[lang];
    for (const [id, s] of Object.entries(text)) document.getElementById(id).textContent = s;
    document.getElementById("card").src = `ui/result.html?lang=${lang}`;
  </script>
</body>
</html>
