<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="desktop.css">
  <style>
    .window { height: 340px; }
    .chat { flex: 1; padding: 12px 20px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; background: #f5f6f8; overflow: hidden; }
    .msg { max-width: 70%; padding: 8px 12px; border-radius: 12px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    .msg.me { align-self: flex-end; background: #d9e8ff; }
    .input { margin: 12px 16px 16px; padding: 9px 14px; min-height: 42px; border: 2px solid #2b6fd6; border-radius: 8px; background: #fff; }
    .caret { display: inline-block; width: 1px; height: 15px; background: #1b1b1b; vertical-align: -3px; margin-left: 1px; }
    .sel { background: #b3d4fc; }
    .new { border-radius: 3px; }

    /* 左侧：步骤 */
    .steps { position: absolute; left: 20px; top: 56px; width: 124px; display: flex; flex-direction: column; gap: 14px; }
    .step { padding: 10px 12px; border-radius: 10px; color: #5b6475; background: rgba(255,255,255,.35); border: 1px solid rgba(255,255,255,.5); }
    .step b { display: block; font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .step span { font-size: 12px; }
    .step.on { color: #1b1b1b; background: rgba(255,255,255,.85); box-shadow: 0 6px 20px rgba(30,40,90,.15); }
    .step.on b { color: #2b6fd6; }

    /* 右侧：按键提示 */
    .keys { position: absolute; right: 6px; top: 150px; width: 148px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .kbd-row { display: flex; gap: 6px; align-items: center; }
    .kbd { min-width: 40px; padding: 7px 8px; white-space: nowrap; border-radius: 8px; background: #fff; border: 1px solid #c9cfdb; border-bottom-width: 4px; font-weight: 600; font-size: 12px; text-align: center; color: #1b1b1b; box-shadow: 0 4px 12px rgba(30,40,90,.12); }
    .kbd.down { transform: translateY(3px); border-bottom-width: 1px; background: #e8f0ff; border-color: #2b6fd6; }
    .plus { color: #5b6475; font-weight: 600; }
    .keys .hint { font-size: 12px; color: #5b6475; text-align: center; }

    /* 画面 = 960x540 的虚拟屏幕 + 屏幕下方的字幕栏 */
    html, body { height: 612px; }
    body { background: #18181b; }
    .screen {
      position: relative; width: 960px; height: 540px; overflow: hidden;
      background:
        radial-gradient(1200px 600px at 15% 10%, #c9d8ff 0%, transparent 60%),
        radial-gradient(900px 500px at 90% 90%, #f3d3ff 0%, transparent 55%),
        linear-gradient(135deg, #dbe6ff, #efe3fb);
    }

    /* 屏幕外的字幕栏：表示用户对着麦克风说的话。仅用于演示，程序不会在屏幕上显示这些文字 */
    .speech { position: absolute; left: 0; right: 0; top: 540px; height: 72px; display: flex; align-items: center; justify-content: center; gap: 12px; color: #fff; font-size: 16px; }
    .speech .label { display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.08); color: #71717a; font-size: 12px; white-space: nowrap; }
    .speech .label .ico { font: 13px "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
    .speech.on .label { background: #e5484d; color: #fff; }
    .speech.on.revise .label { background: #7c5cd6; }
    .speech.on.translate .label { background: #10b981; }

    /* 语音翻译：悬浮条上方的目标语言小条、输出后的核对小窗（样子同 ui/translate.html） */
    .lang-strip { position: absolute; left: 50%; bottom: 106px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 12px; background: rgba(24,24,27,.92); color: #fff; border: 1px solid rgba(255,255,255,.16); border-radius: 20px; box-shadow: 0 4px 16px rgba(0,0,0,.18); white-space: nowrap; }
    .lang-strip .ico { font: 14px "Segoe Fluent Icons", "Segoe MDL2 Assets"; color: #34d399; }
    .lang-strip .label { font-size: 12px; color: #c5c5c5; }
    .lang-strip .box { height: 28px; padding: 0 12px; line-height: 26px; border-radius: 14px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); }
    /* 核对小窗：样子同 ui/result.css（半透明黑底；标题栏和按钮栏离卡片上下边、右边都是 10，内容左边距 12） */
    .tcard { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); width: 440px; display: flex; flex-direction: column; gap: 6px; padding: 0 10px 10px 12px; background: rgba(24,24,27,.92); color: #fff; border: 1px solid rgba(255,255,255,.16); border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
    .tcard .head { display: flex; align-items: center; gap: 8px; height: 26px; margin: 10px 0 0; font-size: 12px; color: rgba(255,255,255,.62); }
    .tcard .head .logo { width: 16px; height: 16px; }
    .tcard .head .x { margin-left: auto; width: 26px; height: 26px; line-height: 26px; text-align: center; font: 10px/26px "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
    .tcard .flabel { font-size: 12px; color: rgba(255,255,255,.62); padding-right: 2px; }
    .tcard .orig { margin-right: 2px; padding: 6px 8px; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; background: rgba(255,255,255,.08); }
    .tcard .row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgba(255,255,255,.62); }
    .tcard .row .box { padding: 2px 10px; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; background: rgba(255,255,255,.08); color: #fff; font-size: 13px; }
    .tcard .tr { color: #fff; }
    .tcard .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 2px; }
    .tcard .btn { height: 26px; padding: 0 12px; line-height: 26px; border-radius: 13px; background: rgba(255,255,255,.08); font-size: 12px; }
    .tcard .btn.accent { background: rgba(96,205,255,.16); color: #60cdff; }
    .speech #stext { white-space: nowrap; }

    /* 记住你的词：手动改对的词、下次自动认对的词 */
    .fixed { border-radius: 3px; }
    .hit { border-radius: 2px; }
    /* 词条入库提示：屏幕右下角（任务栏上方）的小条，样子同 ui/learned.html（悬停才出现的关闭按钮也占着位置） */
    .toast { position: absolute; right: 12px; bottom: 60px; width: 288px; display: flex; flex-direction: column; background: rgba(24,24,27,.92); color: #fff; border: 1px solid rgba(255,255,255,.16); border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,.4); overflow: hidden; }
    .toast .row { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px; }
    .toast .ico { flex: none; align-self: flex-start; margin-top: 2px; color: #60cdff; font: 16px/1 "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
    .toast .main { flex: 1; min-width: 0; }
    .toast .title { color: rgba(255,255,255,.62); font-size: 11px; line-height: 16px; }
    .toast .item { display: flex; align-items: baseline; gap: 6px; font-size: 13px; line-height: 20px; white-space: nowrap; }
    .toast .from { color: rgba(255,255,255,.62); text-decoration: line-through; }
    .toast .arrow { color: rgba(255,255,255,.62); font: 9px "Segoe Fluent Icons", "Segoe MDL2 Assets"; }
    .toast .to { font-weight: 600; }
    .toast .undo { flex: none; height: 26px; padding: 0 10px; line-height: 26px; color: #60cdff; font-size: 12px; }
    .toast .spacer { flex: none; width: 26px; }
    .toast .countdown { height: 2px; background: rgba(255,255,255,.16); }
    .toast .bar { height: 100%; background: #60cdff; transform-origin: left; }
  </style>
</head>
<body>
  <div class="screen">
  <div class="steps">
    <div class="step" id="step1"><b id="s1t"></b><span id="s1d"></span></div>
    <div class="step" id="step2"><b id="s2t"></b><span id="s2d"></span></div>
    <div class="step" id="step3"><b id="s3t"></b><span id="s3d"></span></div>
    <div class="step" id="step4"><b id="s4t"></b><span id="s4d"></span></div>
  </div>
  <div class="window">
    <div class="titlebar"><span class="name" id="app"></span><span class="ctl">&#xE921;</span><span class="ctl">&#xE922;</span><span class="ctl">&#xE8BB;</span></div>
    <div class="chat" id="chat"></div>
    <div class="input" id="input"></div>
  </div>
  <div class="keys" id="keys"><div class="kbd-row" id="kbd"></div><div class="hint" id="khint"></div></div>
  <div class="lang-strip" id="strip"><span class="ico">&#xE8C1;</span><span class="label" id="into1"></span><span class="box" id="target1"></span></div>
  <div class="tcard" id="tcard">
    <div class="head"><img class="logo" src="icon.png" alt=""><span id="ttitle"></span><span class="x">&#xE711;</span></div>
    <span class="flabel" id="olabel"></span>
    <div class="orig" id="heard"></div>
    <div class="row"><span id="into2"></span><span class="box" id="target2"></span></div>
    <div class="tr" id="tr"></div>
    <div class="foot"><span class="btn" id="copy"></span><span class="btn accent" id="retr"></span></div>
  </div>
  <div class="toast" id="toast">
    <div class="row">
      <span class="ico">&#xE82D;</span>
      <div class="main"><div class="title" id="ltitle"></div><div class="item"><span class="from" id="lfrom"></span><span class="arrow">&#xE72A;</span><span class="to" id="lto"></span></div></div>
      <span class="undo" id="lundo"></span><span class="spacer"></span>
    </div>
    <div class="countdown"><div class="bar" id="lbar"></div></div>
  </div>
  <img class="capsule" id="capsule" alt="">
  <div class="taskbar"><span>&#xE8FC;</span><span class="on">&#xE8BD;</span><span>&#xE8B7;</span><span>&#xE774;</span></div>
  </div>
  <div class="speech" id="speech"><span class="label"><span class="ico">&#xE720;</span><span id="slabel"></span></span><span id="stext"></span></div>
  <script>
    // 由 scripts/readme/record-demo.mjs 逐帧调用 render(t)（t 为毫秒），画面完全由 t 决定
    const lang = ["zh", "en", "ja"].includes(new URLSearchParams(location.search).get("lang")) ? new URLSearchParams(location.search).get("lang") : "en";
    document.documentElement.lang = lang;
    const L = {
    zh: {
      app: "团队聊天",
      s1t: "① 语音输入", s1d: "LLM 自动润色", s2t: "② 语音修订", s2d: "说出怎么改",
      tap: "单击", hold: "按住 Right Alt 再按 Space", mic: "你对麦克风说",
      q1: "明天的发布会几点开始？",
      said1: "嗯……那个明天的发布会改到下午三点了，然后呃……记得带上演示用的电脑",
      out1: "明天的发布会改到下午 3 点，记得带上演示用的电脑。",
      q2: "新版语音输入用下来感觉怎么样？",
      draft: "还行吧，就是有时候有点慢",
      said2: "改得正式一点，再补充一句识别很准",
      out2: "整体体验不错，识别非常准确，只是偶尔响应稍慢。",
      s3t: "③ 语音翻译", s3d: "说中文，输出英文", holdT: "按住 Right Alt 再按 T",
      q3: "Could you send me the slides before tomorrow's meeting?",
      said3: "嗯可以的，我今天下班之前发给你，然后有问题随时问我",
      heard3: "嗯可以的，我今天下班之前发给你，然后有问题随时问我。",
      target: "英语",
      out3: "Sure, I'll send them before I leave work today. Feel free to ask me if you have any questions.",
      into: "译成", ttitle: "语音翻译", olabel: "识别出的原文（有识别错误可以直接修改）", copy: "复制译文", retr: "重新翻译",
      s4t: "④ 记住你的词", s4d: "改一次就记住",
      q4: "周五的技术分享谁来讲？",
      said4: "嗯周五请林汐来讲吧，她最近在做向量检索",
      out4: ["周五请", "林希", "林汐", "来讲吧，她最近在做向量检索。"],
      fixHint: "直接在输入框里改对",
      said5: "然后林汐说她会提前十分钟到",
      out5: ["另外，", "林汐", "说她会提前 10 分钟到。"],
      ltitle: "已加入词库", lundo: "撤销",
    }, en: {
      app: "Team chat",
      s1t: "① Dictate", s1d: "polished by an LLM", s2t: "② Voice edit", s2d: "say how to change it",
      tap: "Tap", hold: "Hold Right Alt, press Space", mic: "You say into the mic",
      q1: "What time is the launch meeting tomorrow?",
      said1: "um so the launch meeting moved to like 3pm tomorrow and uh bring the demo laptop",
      out1: "The launch meeting moved to 3 PM tomorrow. Please bring the demo laptop.",
      q2: "How's the new voice typing working for you?",
      draft: "its ok i guess but kinda slow sometimes",
      said2: "make it more formal and add that the accuracy is great",
      out2: "Overall it works well and the accuracy is excellent, though it can be a little slow at times.",
      s3t: "③ Translate", s3d: "speak English, type Japanese", holdT: "Hold Right Alt, press T",
      q3: "明日の会議の前に資料を送ってもらえますか？",
      said3: "sure um I'll send them before I leave today and uh let me know if you have any questions",
      heard3: "Sure, um, I'll send them before I leave today and, uh, let me know if you have any questions.",
      target: "Japanese",
      out3: "はい、今日の退勤前にお送りします。ご不明な点があれば、お気軽にお知らせください。",
      into: "Into", ttitle: "Voice translation", olabel: "Recognized text (fix any recognition errors here)", copy: "Copy translation", retr: "Retranslate",
      s4t: "④ Your words", s4d: "fix it once",
      q4: "Who's presenting at Friday's tech talk?",
      said4: "let's ask Siobhan she's been working on vector search",
      out4: ["Let's ask ", "Shivon", "Siobhan", ". She's been working on vector search."],
      fixHint: "Fix it right in the text box",
      said5: "oh and Siobhan says she'll be there ten minutes early",
      out5: ["Also, ", "Siobhan", " says she'll be there 10 minutes early."],
      ltitle: "Added to vocabulary", lundo: "Undo",
    }, ja: {
      app: "チームチャット",
      s1t: "① 音声入力", s1d: "LLM が自動で整形", s2t: "② 音声で修正", s2d: "直し方を話す",
      tap: "1 回押す", hold: "Right Alt を押したまま Space", mic: "マイクに話した内容",
      q1: "明日の発表会って何時から？",
      said1: "えーと、明日の発表会は午後3時に変わって、あの、デモ用のパソコンも持ってきてください",
      out1: "明日の発表会は午後 3 時に変更になりました。デモ用のパソコンを持ってきてください。",
      q2: "新しい音声入力、使ってみてどう？",
      draft: "まあまあかな、たまにちょっと遅いけど",
      said2: "もっと丁寧にして、認識がすごく正確なことも付け足して",
      out2: "全体的に使いやすく、認識もとても正確です。ただ、ときどき反応が少し遅くなります。",
      s3t: "③ 音声翻訳", s3d: "日本語で話して英語で入力", holdT: "Right Alt を押したまま T",
      q3: "Could you send me the slides before tomorrow's meeting?",
      said3: "はい、えーと、今日の帰りまでに送りますね、あの、何かあったら聞いてください",
      heard3: "はい、えーと、今日の帰りまでに送りますね。あの、何かあったら聞いてください。",
      target: "英語",
      out3: "Sure, I'll send them before I head home today. Let me know if you have any questions.",
      into: "翻訳先", ttitle: "音声翻訳", olabel: "認識された原文（認識の誤りはここで直接修正できます）", copy: "訳文をコピー", retr: "再翻訳",
      s4t: "④ 単語学習", s4d: "一度直せば覚える",
      q4: "金曜の技術共有会、誰が発表する？",
      said4: "えーと、金曜は詩織さんにお願いしよう、最近ベクトル検索をやってるから",
      out4: ["金曜は", "志織", "詩織", "さんにお願いしましょう。最近ベクトル検索に取り組んでいます。"],
      fixHint: "入力欄でそのまま直す",
      said5: "あと詩織さん、10分早く来るって",
      out5: ["あと、", "詩織", "さんは 10 分早く来るそうです。"],
      ltitle: "辞書に追加しました", lundo: "元に戻す",
    } }[lang];
    for (const id of ["app", "s1t", "s1d", "s2t", "s2d", "s3t", "s3d", "s4t", "s4d", "ttitle", "olabel", "copy", "retr", "heard3", "ltitle", "lundo"]) {
      const el = document.getElementById(id === "heard3" ? "heard" : id);
      el.textContent = L[id];
    }
    for (const id of ["into1", "into2"]) document.getElementById(id).textContent = L.into;
    for (const id of ["target1", "target2"]) document.getElementById(id).textContent = L.target;
    document.getElementById("tr").textContent = L.out3;
    document.getElementById("slabel").textContent = L.mic;
    // 第 ④ 段：[前文, 认错的词, 改对的词, 后文]
    const [pre4, wrong4, right4, post4] = L.out4;
    const fixed4 = pre4 + right4 + post4;
    const out5 = L.out5.join("");
    document.getElementById("lfrom").textContent = wrong4;
    document.getElementById("lto").textContent = right4;

    // === 时间轴（毫秒）===
    const T = {
      rec1: 700, stop1: 4600, pol1: 5500, out1: 7000, send1: 8200, q2: 8900,
      type2: 9500, typed2: 10700, sel2: 11000, rev2: 11700, stop2: 14500, pol2: 15300, out2: 16700, send2: 17900,
      q3: 18600, rec3: 19300, stop3: 23300, pol3: 24100, out3: 25500, card3: 26700, send3: 29500,
      q4: 30500, rec4: 31200, stop4: 35000, pol4: 35800, out4: 37000, fix4: 38200, fixed4: 38800, send4: 39900, toast4: 40600,
      rec5: 41800, stop5: 44400, pol5: 45000, out5: 46000, send5: 47800,
      end: 49200,
    };
    const FPS = 30;
    const FRAMES = { recording: 240, revising: 180, translating: 180, transcribing: 60, polishing: 90 };
    // 悬浮条：[开始, 结束, 状态]
    const CAPSULE = [
      [T.rec1, T.stop1, "recording"], [T.stop1, T.pol1, "transcribing"], [T.pol1, T.out1, "polishing"],
      [T.rev2, T.stop2, "revising"], [T.stop2, T.pol2, "transcribing"], [T.pol2, T.out2, "polishing"],
      [T.rec3, T.stop3, "translating"], [T.stop3, T.pol3, "transcribing"], [T.pol3, T.out3, "polishing"],
      [T.rec4, T.stop4, "recording"], [T.stop4, T.pol4, "transcribing"], [T.pol4, T.out4, "polishing"],
      [T.rec5, T.stop5, "recording"], [T.stop5, T.pol5, "transcribing"], [T.pol5, T.out5, "polishing"],
    ];
    // 按键：[按下时刻, 键, 提示]
    const PRESSES = [
      [T.rec1, ["Right Alt"], L.tap], [T.stop1, ["Right Alt"], L.tap],
      [T.rev2, ["Right Alt", "Space"], L.hold], [T.stop2, ["Right Alt"], L.tap],
      [T.rec3, ["Right Alt", "T"], L.holdT], [T.stop3, ["Right Alt"], L.tap],
      [T.rec4, ["Right Alt"], L.tap], [T.stop4, ["Right Alt"], L.tap], [T.fix4, [], L.fixHint],
      [T.rec5, ["Right Alt"], L.tap], [T.stop5, ["Right Alt"], L.tap],
    ];

    const $ = (id) => document.getElementById(id);
    const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
    const ramp = (t, start, ms) => clamp((t - start) / ms);
    // 淡出到 30% 时直接消失：动图的有损 WebP 编码会把很小的逐帧变化当成「没变」跳过，
    // 低对比度的元素慢慢淡出时，画面会停在半透明的中间状态留下残影；最后一步变化够大才会被刷新
    const fadeOut = (x) => (x < 0.3 ? 0 : x);
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    const slice = (s, n) => Array.from(s).slice(0, n).join("");
    const len = (s) => Array.from(s).length;
    const frame = (name, i) => `img/frames/${name}-${String(i).padStart(4, "0")}.png`;

    // 预加载所有悬浮条帧，切换时不用等待
    const cache = {};
    window.ready = Promise.all(Object.entries(FRAMES).flatMap(([name, n]) =>
      Array.from({ length: n }, (_, i) => {
        const img = new Image();
        img.src = frame(name, i);
        cache[img.src] = img;
        return img.decode();
      }))).then(() => document.fonts.ready);

    function render(t) {
      t = t % T.end;
      $("step1").classList.toggle("on", t < T.q2);
      $("step2").classList.toggle("on", t >= T.q2 && t < T.q3);
      $("step3").classList.toggle("on", t >= T.q3 && t < T.q4);
      $("step4").classList.toggle("on", t >= T.q4);

      // 聊天记录
      const msgs = [["", L.q1]];
      if (t >= T.send1) msgs.push(["me", L.out1]);
      if (t >= T.q2) msgs.push(["", L.q2]);
      if (t >= T.send2) msgs.push(["me", L.out2]);
      if (t >= T.q3) msgs.push(["", L.q3]);
      if (t >= T.send3) msgs.push(["me", L.out3]);
      if (t >= T.q4) msgs.push(["", L.q4]);
      if (t >= T.send4) msgs.push(["me", fixed4]);
      if (t >= T.send5) msgs.push(["me", out5]);
      $("chat").innerHTML = msgs.map(([c, s]) => `<div class="msg ${c}">${esc(s)}</div>`).join("");

      // 输入框
      const caret = Math.floor(t / 530) % 2 === 0 ? '<span class="caret"></span>' : '<span class="caret" style="opacity:0"></span>';
      let html = caret;
      if (t >= T.out1 && t < T.send1) {
        const flash = fadeOut(1 - ramp(t, T.out1, 900));
        html = `<span class="new" style="background:rgba(251,191,36,${0.35 * flash})">${esc(L.out1)}</span>${caret}`;
      } else if (t >= T.type2 && t < T.sel2) {
        html = esc(slice(L.draft, Math.round(len(L.draft) * ramp(t, T.type2, T.typed2 - T.type2)))) + caret;
      } else if (t >= T.sel2 && t < T.out2) {
        const n = Math.round(len(L.draft) * ramp(t, T.sel2, 350));
        const chars = Array.from(L.draft);
        html = esc(chars.slice(0, len(L.draft) - n).join("")) + `<span class="sel">${esc(chars.slice(len(L.draft) - n).join(""))}</span>`;
      } else if (t >= T.out2 && t < T.send2) {
        const flash = fadeOut(1 - ramp(t, T.out2, 900));
        html = `<span class="new" style="background:rgba(251,191,36,${0.35 * flash})">${esc(L.out2)}</span>${caret}`;
      } else if (t >= T.out3 && t < T.send3) {
        const flash = fadeOut(1 - ramp(t, T.out3, 900));
        html = `<span class="new" style="background:rgba(52,211,153,${0.35 * flash})">${esc(L.out3)}</span>${caret}`;
      } else if (t >= T.out4 && t < T.fix4) {
        // 输入后人名认错了（演示里给认错的词标上红色波浪线，程序本身不会标）
        const flash = fadeOut(1 - ramp(t, T.out4, 900));
        const wave = t >= T.out4 + 500 ? "text-decoration: underline wavy #e5484d; text-underline-offset: 3px;" : "";
        html = `<span class="new" style="background:rgba(251,191,36,${0.35 * flash})">${esc(pre4)}<span style="${wave}">${esc(wrong4)}</span>${esc(post4)}</span>${caret}`;
      } else if (t >= T.fix4 && t < T.fixed4) {
        // 选中认错的词
        const n = Math.round(len(wrong4) * ramp(t, T.fix4, 250));
        const w = Array.from(wrong4);
        html = esc(pre4) + `<span class="sel">${esc(w.slice(0, n).join(""))}</span>${esc(w.slice(n).join("") + post4)}`;
      } else if (t >= T.fixed4 && t < T.send4) {
        // 打上正确的写法
        const flash = fadeOut(1 - ramp(t, T.fixed4 + 300, 700));
        html = `${esc(pre4)}<span class="fixed" style="background:rgba(43,111,214,${0.18 * flash})">${esc(right4)}</span>${caret}${esc(post4)}`;
      } else if (t >= T.out5 && t < T.send5) {
        // 再说一次就认对了：整段照常闪一下，认对的词多标一会儿
        const flash = fadeOut(1 - ramp(t, T.out5, 900));
        const mark = fadeOut(1 - ramp(t, T.out5 + 900, 600));
        const [a, b, c] = L.out5;
        html = `<span class="new" style="background:rgba(251,191,36,${0.35 * flash})">${esc(a)}<span class="hit" style="box-shadow:inset 0 -2px 0 rgba(43,111,214,${mark})">${esc(b)}</span>${esc(c)}</span>${caret}`;
      }
      $("input").innerHTML = html;

      // 屏幕外字幕：录音期间逐字出现，文字落地后淡出；标签只在说话时亮起
      const speech = $("speech");
      let said = null, start = 0, stop = 0, out = 0;
      if (t >= T.rec1 && t < T.out1 + 400) [said, start, stop, out] = [L.said1, T.rec1, T.stop1, T.out1];
      if (t >= T.rev2 && t < T.out2 + 400) [said, start, stop, out] = [L.said2, T.rev2, T.stop2, T.out2];
      if (t >= T.rec3 && t < T.out3 + 400) [said, start, stop, out] = [L.said3, T.rec3, T.stop3, T.out3];
      if (t >= T.rec4 && t < T.out4 + 400) [said, start, stop, out] = [L.said4, T.rec4, T.stop4, T.out4];
      if (t >= T.rec5 && t < T.out5 + 400) [said, start, stop, out] = [L.said5, T.rec5, T.stop5, T.out5];
      if (said) {
        const n = Math.max(1, Math.round(len(said) * ramp(t, start + 200, stop - start - 500)));
        const [open, close] = lang === "ja" ? ["「", "」"] : ["“", "”"];
        $("stext").textContent = `${open}${slice(said, n)}${close}`;
        $("stext").style.opacity = Math.min(ramp(t, start, 150), fadeOut(1 - ramp(t, out, 400)));
        speech.classList.toggle("on", t < stop);
        speech.classList.toggle("revise", said === L.said2);
        speech.classList.toggle("translate", said === L.said3);
      } else {
        $("stext").textContent = "";
        speech.classList.remove("on");
      }

      // 按键提示：按下 150 ms，提示保留 1.4 s
      const press = PRESSES.filter(([at]) => t >= at && t < at + 1400).pop();
      if (press) {
        const [at, keys, hint] = press;
        const down = t < at + 150 ? " down" : "";
        $("kbd").innerHTML = keys.map((k) => `<span class="kbd${down}">${k}</span>`).join('<span class="plus">+</span>');
        $("khint").textContent = hint;
        $("keys").style.opacity = Math.min(ramp(t, at, 80), fadeOut(1 - ramp(t, at + 1100, 300)));
      } else {
        $("keys").style.opacity = 0;
      }

      // 语音翻译：录音时悬浮条上方显示目标语言；译文输入后弹出核对小窗，发送消息时关掉
      $("strip").style.opacity = t >= T.rec3 && t < T.stop3 ? Math.min(ramp(t, T.rec3, 120), fadeOut(1 - ramp(t, T.stop3 - 120, 120))) : 0;
      $("tcard").style.opacity = t >= T.card3 && t < T.send3 ? Math.min(ramp(t, T.card3, 150), fadeOut(1 - ramp(t, T.send3 - 150, 150))) : 0;

      // 记住你的词：改对后发送，右下角弹出入库提示；底部倒计时条按程序里的 8 秒缩短
      $("toast").style.opacity = t >= T.toast4 ? Math.min(ramp(t, T.toast4, 150), fadeOut(1 - ramp(t, T.end - 200, 150))) : 0;
      $("lbar").style.transform = `scaleX(${1 - clamp((t - T.toast4) / 8000)})`;

      // 悬浮条：用程序自身绘制的逐帧图片；出现/消失时淡入淡出约 100 ms
      const cap = $("capsule");
      const seg = CAPSULE.find(([a, b]) => t >= a && t < b);
      const last = CAPSULE.filter(([, b]) => t >= b).pop();
      if (seg) {
        const [a, , name] = seg;
        const i = Math.floor(((t - a) / 1000) * FPS) % FRAMES[name];
        cap.src = frame(name, i);
        const first = !CAPSULE.some(([, b]) => b === a);
        cap.style.opacity = first ? ramp(t, a, 100) : 1;
      } else if (last && t < last[1] + 120) {
        const [a, b, name] = last;
        cap.src = frame(name, Math.floor(((b - a) / 1000) * FPS) % FRAMES[name]);
        cap.style.opacity = fadeOut(1 - ramp(t, b, 100));
      } else {
        cap.style.opacity = 0;
      }
      // 帧图片都已预加载；decode() 偶尔不返回，最多等 200 ms
      const decoded = cap.src ? cap.decode().catch(() => {}) : Promise.resolve();
      return Promise.race([decoded, new Promise((r) => setTimeout(r, 200))]);
    }
    // 直接用浏览器打开时自动播放，方便预览
    if (!navigator.webdriver && !location.search.includes("record")) {
      window.ready.then(() => {
        const t0 = performance.now();
        const loop = () => { render(performance.now() - t0); requestAnimationFrame(loop); };
        loop();
      });
    }
  </script>
</body>
</html>
