# cargo-about 配置：列出随 Aoide 分发的 Rust 依赖及其许可证（见 scripts/third-party-licenses.ps1）
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
# 构建期工具（bindgen、cmake 等）不进入安装包
ignore-build-dependencies = true
ignore-dev-dependencies = true
