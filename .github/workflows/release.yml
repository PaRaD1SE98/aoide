name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Visual Studio 生成器在 whisper.cpp 嵌套的 vulkan-shaders-gen 子工程里找不到编译器
      CMAKE_GENERATOR: Ninja
      # 与 Rust 的 +crt-static 保持一致
      CMAKE_MSVC_RUNTIME_LIBRARY: MultiThreaded
      CMAKE_POLICY_DEFAULT_CMP0091: NEW
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # 发版按标签触发，标签上存的缓存下一个标签读不到，不必保存
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false

      - run: pnpm install --frozen-lockfile

      # 安装包附带 Vulkan Loader（见 scripts/build-env.ps1）
      - name: Vendor Vulkan loader
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/vendor | Out-Null
          Copy-Item "$env:SystemRoot\System32\vulkan-1.dll" src-tauri/vendor/

      # 不含 TTS（espeak-ng，GPL-3.0）的 sherpa-onnx 静态库，见 scripts/build-sherpa-onnx.ps1
      # 缓存只跟 sherpa-onnx-sys 的版本和构建脚本有关，其他依赖变化不必重编。
      # 缓存由 main 上的 warm-cache.yml 保存（标签存的缓存其他标签读不到），这里只读取；
      # 没命中（缓存还没预热好）时照常现编
      - name: sherpa-onnx version
        id: sherpa-version
        shell: pwsh
        run: |
          $lock = Get-Content src-tauri/Cargo.lock -Raw
          if ($lock -notmatch 'name = "sherpa-onnx-sys"\s+version = "([^"]+)"') { throw "sherpa-onnx-sys not found in Cargo.lock" }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Restore sherpa-onnx
        id: sherpa-cache
        uses: actions/cache/restore@v4
        with:
          path: src-tauri/vendor/sherpa-onnx
          key: sherpa-onnx-${{ steps.sherpa-version.outputs.version }}-${{ hashFiles('scripts/build-sherpa-onnx.ps1') }}

      - name: Build sherpa-onnx without TTS
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/build-sherpa-onnx.ps1

      # 第三方许可声明，随安装包分发
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Generate third-party licenses
        shell: pwsh
        run: ./scripts/third-party-licenses.ps1

      # 注意：v0.3.1 发版时，GITHUB_TOKEN 创建 Release 被拒（Resource not accessible by integration），
      # 但往已有的草稿里上传文件正常。遇到这种情况，先用账号建好草稿再重跑：
      #   gh release create vX.Y.Z --draft --verify-tag --title "Aoide vX.Y.Z" --notes ""
      # 发布版额外生成自动更新用的签名包和 latest.json（tauri.release.conf.json），
      # 应用从 releases/latest/download/latest.json 检查更新；草稿发布前不会被已安装的用户看到
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Aoide ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json
