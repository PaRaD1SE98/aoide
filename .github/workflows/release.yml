name: Release

# 推送 v* 标签：构建 Windows 和 macOS 安装包，上传到草稿 Release。
# Pull Request / 手动运行（Actions 页面 Run workflow）：构建调试版，安装包作为本次运行的产物（Artifacts）上传，
# 不发版、不签名，用于合并前验证两个平台都能构建。调试版编译更快，objc2 还会校验每次 Objective-C 消息的参数类型

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - src-tauri/**
      - ui/**
      - scripts/build-sherpa-onnx.*
      - scripts/third-party-licenses.ps1
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # 缓存键必须与 warm-cache.yml 中的完全一致
            sherpa-key: sherpa-onnx
            sherpa-script: scripts/build-sherpa-onnx.ps1
            sherpa-build: ./scripts/build-sherpa-onnx.ps1
          # Apple 芯片（arm64）
          - os: macos-latest
            sherpa-key: sherpa-onnx-macos
            sherpa-script: scripts/build-sherpa-onnx.sh
            sherpa-build: bash ./scripts/build-sherpa-onnx.sh
          # Intel（x86_64）
          - os: macos-15-intel
            sherpa-key: sherpa-onnx-macos-x64
            sherpa-script: scripts/build-sherpa-onnx.sh
            sherpa-build: bash ./scripts/build-sherpa-onnx.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Visual Studio 生成器在 whisper.cpp 嵌套的 vulkan-shaders-gen 子工程里找不到编译器
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          # 与 Rust 的 +crt-static 保持一致
          "CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" >> $env:GITHUB_ENV
          "CMAKE_POLICY_DEFAULT_CMP0091=NEW" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: macOS build environment
        if: runner.os == 'macOS'
        run: |
          # 与 tauri.macos.conf.json 的最低系统版本一致（Rust、whisper.cpp 都读这个变量）
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # 发版按标签触发，标签上存的缓存下一个标签读不到，不必保存
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          save-if: false

      - run: pnpm install --frozen-lockfile

      # 安装包附带 Vulkan Loader（见 scripts/build-env.ps1）
      - name: Vendor Vulkan loader
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/vendor | Out-Null
          Copy-Item "$env:SystemRoot\System32\vulkan-1.dll" src-tauri/vendor/

      # 不含 TTS（espeak-ng，GPL-3.0）的 sherpa-onnx 静态库，见 scripts/build-sherpa-onnx.ps1 / .sh
      # 缓存只跟 sherpa-onnx-sys 的版本和构建脚本有关，其他依赖变化不必重编。
      # 缓存由 main 上的 warm-cache.yml 保存（标签存的缓存其他标签读不到），这里只读取；
      # 没命中（缓存还没预热好）时照常现编
      - name: sherpa-onnx version
        id: sherpa-version
        shell: pwsh
        run: |
          $lock = Get-Content src-tauri/Cargo.lock -Raw
          if ($lock -notmatch 'name = "sherpa-onnx-sys"\s+version = "([^"]+)"') { throw "sherpa-onnx-sys not found in Cargo.lock" }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Restore sherpa-onnx
        id: sherpa-cache
        uses: actions/cache/restore@v4
        with:
          path: src-tauri/vendor/sherpa-onnx
          key: ${{ matrix.sherpa-key }}-${{ steps.sherpa-version.outputs.version }}-${{ hashFiles(matrix.sherpa-script) }}

      - name: Build sherpa-onnx without TTS
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ${{ matrix.sherpa-build }}

      # 第三方许可声明，随安装包分发
      - uses: taiki-e/install-action@v2
        if: runner.os != 'macOS' || runner.arch != 'X64'
        with:
          tool: cargo-about

      # cargo-about 没有 Intel Mac 的预编译版本，从源码安装（命令行工具在 cli 特性里）
      - name: Install cargo-about from source
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: cargo install cargo-about --locked --features cli

      - name: Generate third-party licenses
        shell: pwsh
        run: ./scripts/third-party-licenses.ps1

      # 注意：v0.3.1 发版时，GITHUB_TOKEN 创建 Release 被拒（Resource not accessible by integration），
      # 但往已有的草稿里上传文件正常。遇到这种情况，先用账号建好草稿再重跑：
      #   gh release create vX.Y.Z --draft --verify-tag --title "Aoide vX.Y.Z" --notes ""
      # 发布版额外生成自动更新用的签名包和 latest.json（tauri.release.conf.json），
      # 应用从 releases/latest/download/latest.json 检查更新；草稿发布前不会被已安装的用户看到。
      # 两个平台各自上传到同一个草稿，latest.json 由 tauri-action 合并。
      # 不是标签时标签名为空：只构建调试版，不发版
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('Aoide {0}', github.ref_name) || '' }}
          releaseDraft: true
          prerelease: false
          args: ${{ github.ref_type == 'tag' && '--config src-tauri/tauri.release.conf.json' || '--debug' }}

      - name: Upload installers
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: aoide-${{ runner.os }}-${{ runner.arch }}-debug
          path: |
            src-tauri/target/debug/bundle/nsis/*.exe
            src-tauri/target/debug/bundle/dmg/*.dmg
