name: Warm build cache

# 在 main 分支上预先编译 sherpa-onnx、下载 Vulkan SDK 并存成缓存，供发版流程（release.yml）使用。
# GitHub 的缓存只能被同一分支 / 标签或默认分支的运行读取：发版是按标签触发的，
# 上一个标签存的缓存下一个标签读不到，所以缓存要存在 main 上。

on:
  push:
    branches: [main]
    paths:
      - src-tauri/Cargo.lock
      - scripts/build-sherpa-onnx.ps1
      - scripts/build-sherpa-onnx.sh
      - .github/workflows/warm-cache.yml
  workflow_dispatch:

jobs:
  warm:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 与 release.yml 中的设置一致，缓存键才一致
          - os: windows-latest
            sherpa-key: sherpa-onnx
            sherpa-script: scripts/build-sherpa-onnx.ps1
            sherpa-build: ./scripts/build-sherpa-onnx.ps1
          - os: macos-latest
            sherpa-key: sherpa-onnx-macos
            sherpa-script: scripts/build-sherpa-onnx.sh
            sherpa-build: bash ./scripts/build-sherpa-onnx.sh
          # Intel（x86_64）
          - os: macos-15-intel
            sherpa-key: sherpa-onnx-macos-x64
            sherpa-script: scripts/build-sherpa-onnx.sh
            sherpa-build: bash ./scripts/build-sherpa-onnx.sh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded" >> $env:GITHUB_ENV
          "CMAKE_POLICY_DEFAULT_CMP0091=NEW" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # 与 release.yml 相同的设置，缓存键才一致
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true

      # 缓存键必须与 release.yml 中的完全一致
      - name: sherpa-onnx version
        id: sherpa-version
        shell: pwsh
        run: |
          $lock = Get-Content src-tauri/Cargo.lock -Raw
          if ($lock -notmatch 'name = "sherpa-onnx-sys"\s+version = "([^"]+)"') { throw "sherpa-onnx-sys not found in Cargo.lock" }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - name: Cache sherpa-onnx
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/vendor/sherpa-onnx
          key: ${{ matrix.sherpa-key }}-${{ steps.sherpa-version.outputs.version }}-${{ hashFiles(matrix.sherpa-script) }}

      - name: Build sherpa-onnx without TTS
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ${{ matrix.sherpa-build }}
